name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # If PROXY_BASE_URL is set (Settings -> Secrets and variables -> Actions
      # -> Variables), the deployed site defaults to Live mode against that
      # hosted proxy (e.g. Render — see render.yaml). Otherwise it defaults to
      # the self-contained demo simulator, since Pages can't run a server.
      - name: Build client
        working-directory: web
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE: ${{ vars.PROXY_BASE_URL && 'proxy' || 'demo' }}
          VITE_PROXY_BASE: ${{ vars.PROXY_BASE_URL }}
        run: npm run build -w client

      - name: Add SPA fallback for GitHub Pages routing
        run: cp web/client/dist/index.html web/client/dist/404.html

      # NOTE: this step fails with "Not Found" on a repo where Pages has never
      # been touched, even with Settings -> Pages -> Source set to "GitHub
      # Actions" — it needs one successful run (or a manual visit to that
      # settings page) before the Pages site object exists. That's a one-time
      # bootstrap failure, not a bug: re-running the workflow after enabling
      # Pages resolves it.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
