name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Pages can't run a server, so the site defaults to 'direct': the browser
      # reads cf.nascar.com itself, which is allowed because those feeds send
      # `Access-Control-Allow-Origin: *`. No proxy needed for live data.
      #
      # PROXY_BASE_URL (Settings -> Secrets and variables -> Actions ->
      # Variables) is optional. Set it only if you want a hosted proxy (e.g.
      # Render — see render.yaml) for its server-side caching; it just
      # pre-fills the proxy URL, and "Live (via proxy)" stays a manual choice
      # in the TopBar so a sleeping free-tier service can't stall the site.
      - name: Build client
        working-directory: web
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE: 'direct'
          VITE_PROXY_BASE: ${{ vars.PROXY_BASE_URL }}
        run: npm run build -w client

      - name: Add SPA fallback for GitHub Pages routing
        run: cp web/client/dist/index.html web/client/dist/404.html

      # NOTE: this step fails with "Not Found" on a repo where Pages has never
      # been touched, even with Settings -> Pages -> Source set to "GitHub
      # Actions" — it needs one successful run (or a manual visit to that
      # settings page) before the Pages site object exists. That's a one-time
      # bootstrap failure, not a bug: re-running the workflow after enabling
      # Pages resolves it.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
